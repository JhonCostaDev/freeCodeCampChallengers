<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/output.css">

    <!-- ICONS FONT AWESONME -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <!-- ICONS FONT AWESONME -->

    <!--Google Fonts Roboto-->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>

      <!-- <script src="scripts/script.js" defer></script> -->

      <script type="module" src="scripts/main.js" ></script>

    <title>Lanches Bar</title>
</head>
<body class="font-roboto">
    <header class="w-full h-[420px] bg-zinc-900 bg-[url(../assets/bg.png)] bg-cover bg-center ">
        <div class="w-full h-full flex flex-col justify-center items-center">
            <img 
                src="https://lucasoliveira000.github.io/projeto-site-cardapio-lanches-bar/icones/logo-lanches-bar-header-600px.png" 
                alt=""
                class="w-62 h-62 hover:scale-110 duration-200" 
            >
            <!-- <h1 class="text-4xl mt-4 mb-2 font-bold text-white">Lanches Bar</h1> -->
            <p class="text-white text-2xl" >Desde 2020</p>
            <span class="text-white">O melhor da região!</span>
            <div class=" text-white font-bold bg-red-900 px-4 py-1 rounded-lg mt-5">
            <span class="text-yellow-500">Bar Espetaria Delívery</span>
            </div>
        </div>
        
    </header>
    
    <h2 class="text-5xl md:text-5xl font-bold text-center mt-9 mb-6">Cardápio</h2>
    
    <div id="menu">
        
    </div>


    <!--MODAL CART-->
    <div class="bg-black/60 w-full h-full fixed top-0 left-0 z-99 items-center justify-center hidden" id="cart-modal">
        <div class="bg-white p-5 rounded-md min-w-[90%] md:min-w-[600px]">
            <h2 class="text-center font-bold text-3xl mb-2">Meu carrinho</h2>

            <div 
                id="cart-items"
                class="flex justify-between mb-2 flex-col"
            ></div>
            <p class="font-bold">Total: <span id="cart-total">0.00</span></p>
            <p class="font-bold mt-4">Endereço de entrega: </p>
            <input 
                type="text"
                placeholder="Digite seu endereço completo..."
                id="address"
                class="w-full border-2 p-1 rounded my-1"
                >
                <p class="text-red-500 hidden" id="address-warn">Digite seu endereço completo!</p>
                <div class="flex items-center justify-between mt-5 w-full">
                    <button id="close-modal-btn">Fechar</button>
                    <button id="checkout-btn" class="bg-green-500 text-white px-4 py-1 rounded">Finalizar Pedido</button>
                </div>
        </div>
    </div>
    <!--END MODAL CART-->

    <footer class="w-full bg-red-500 py-3 fixed bottom-0 z-40 flex items-center justify-center">
        <button 
            class="flex items-center gap-2 text-white font-bold"
            id="cart-btn"    
        >
                (<span id="cart-count">0</span>)
                Veja meu carrinho
                <i class="fa fa-cart-plus text-lg text-white"></i>
        </button>
    </footer>
</body>
</html>
